<!-- UX-12 Phase 7 PR #13: redirect to /home when no project is active.
     Direct URLs and PWA shortcuts continue to work when a project IS active. -->
<script>
(function(){
  try {
    var active = localStorage.getItem('crossstitch_active_project');
    if (!active) {
      var qs = location.search || '';
      var skip = /(\?|&)(from=home|action=)/.test(qs);
      if (!skip) { location.replace('home.html'); return; }
    }
  } catch (_) { /* localStorage blocked â†’ load tool normally */ }
})();
</script>

<!-- pdf.js + pdf-importer are lazy-loaded on first PDF import -->
<script>
window.loadScript = function(src, opts) {
  if (document.querySelector('script[src="' + src + '"]')) return Promise.resolve();
  opts = opts || {};
  return new Promise(function(res, rej) {
    var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej;
    if (opts.integrity) { s.integrity = opts.integrity; s.crossOrigin = opts.crossOrigin || 'anonymous'; s.referrerPolicy = 'no-referrer'; }
    document.head.appendChild(s);
  });
};
window.loadPdfStack = function() {
  return window.loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', { integrity: 'sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e' })
    .then(function() { if (typeof pdfjsLib !== 'undefined') pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js'; return window.loadScript('pdf-importer.js'); });
};
</script>

<!-- Cat C perf split: conditionally preload the ImportWizard bundle only
     when the experimental flag is on OR when the user has just clicked the
     Home "Digitise a printed chart" tile (Design 1 — sessionStorage flag
     cs_force_wizard set by home-app.js handleNewFromChart). Default users
     never fetch the 30 KB. The wizard branch in tracker-app.js already
     falls back to the legacy modal if window.ImportWizard isn't present. -->
<script>
(function maybePreloadImportWizard() {
  try {
    var on = window.UserPrefs && window.UserPrefs.get && window.UserPrefs.get('experimental.importWizard');
    var forced = false;
    try { forced = sessionStorage.getItem('cs_force_wizard') === '1'; } catch (_) {}
    if (!on && !forced) return;
    var go = function () {
      if (document.querySelector('script[src="creator/import-wizard-bundle.js"]')) return;
      var s = document.createElement('script');
      s.src = 'creator/import-wizard-bundle.js';
      document.head.appendChild(s);
    };
    // When forced (user just clicked the Home tile), load immediately —
    // they're about to need it. Otherwise wait for idle.
    if (forced) go();
    else if (typeof requestIdleCallback === 'function') requestIdleCallback(go, { timeout: 2000 });
    else setTimeout(go, 0);
  } catch (_) {}
})();

/* Home "Digitise a printed chart" handoff (Design 1).
   When the user clicks the Home tile we serialise the picked image into
   sessionStorage (cs_pending_image_dataurl / _name / _type), set
   cs_force_wizard='1', and navigate here with ?action=open-wizard.
   This synchronous IIFE reconstructs the File object, hands it to
   tracker-app.js via window.__pendingTrackerImportFile (which the existing
   useEffect at the top of TrackerApp picks up), and sets
   window.__forceImportWizard so the wizard branch activates regardless of
   the experimental pref. */
(function processOpenWizardAction() {
  try {
    var p = new URLSearchParams(window.location.search);
    if (p.get('action') !== 'open-wizard') return;
    // Strip the action= param so a reload doesn't re-trigger the handoff
    // after the user has already started editing in the wizard.
    var clean = window.location.pathname + (function () {
      p.delete('action'); p.delete('from');
      var rest = p.toString();
      return rest ? '?' + rest : '';
    })();
    window.history.replaceState({}, '', clean);
    var dataUrl = null, name = 'chart.jpg', type = 'image/jpeg';
    try {
      dataUrl = sessionStorage.getItem('cs_pending_image_dataurl');
      name    = sessionStorage.getItem('cs_pending_image_name') || name;
      type    = sessionStorage.getItem('cs_pending_image_type') || type;
    } catch (_) {}
    if (!dataUrl) return;
    var b64 = dataUrl.split(',')[1] || '';
    var byteStr = atob(b64);
    var ab = new ArrayBuffer(byteStr.length);
    var ia = new Uint8Array(ab);
    for (var i = 0; i < byteStr.length; i++) ia[i] = byteStr.charCodeAt(i);
    var blob = new Blob([ab], { type: type });
    window.__pendingTrackerImportFile = new File([blob], name, { type: type });
    window.__forceImportWizard = true;
    // Clear handoff payload — tracker-app's useEffect has the File now.
    try {
      sessionStorage.removeItem('cs_pending_image_dataurl');
      sessionStorage.removeItem('cs_pending_image_name');
      sessionStorage.removeItem('cs_pending_image_type');
      sessionStorage.removeItem('cs_force_wizard');
    } catch (_) {}
  } catch (e) { /* never block the page */ }
})();
</script>
<script>
/* PERF (action plan Â§2A.5): cache the in-browser Babel compile of
   tracker-app.js in localStorage. Without this, every page load
   re-runs Babel on the ~6 KLOC source (~80â€“150 ms TBT). The cache
   key is shared with index.html so visitors who land on either entry
   benefit from a single compile. The hash suffix is auto-bumped by
   build-creator-bundle.js when tracker-app.js content changes. */
(function () {
  if (typeof window === 'undefined') return;
  var TRACKER_CACHE_KEY = 'babel_tracker_e1e5125695';
  var cached = null;
  try { cached = localStorage.getItem(TRACKER_CACHE_KEY); } catch (e) {}
  if (cached) {
    /* Wrap in IIFE so const/let don't collide with the surrounding script. */
    var s = document.createElement('script');
    s.textContent = '(function(){' + cached + '})();';
    document.head.appendChild(s);
    return;
  }
  /* No cache yet: fetch + compile. On fetch failure (file://, offline)
     fall back to a text/babel tag so Babel-standalone compiles inline. */
  if (typeof Babel === 'undefined') {
    var fb0 = document.createElement('script'); fb0.type = 'text/babel'; fb0.src = 'tracker-app.js';
    document.head.appendChild(fb0);
    return;
  }
  fetch('tracker-app.js').then(function (r) {
    return r.ok ? r.text() : Promise.reject('fetch failed');
  }).then(function (src) {
    var compiled = Babel.transform(src, { presets: ['react'], filename: 'tracker-app.js' }).code;
    try { localStorage.setItem(TRACKER_CACHE_KEY, compiled); } catch (e) {}
    var s = document.createElement('script');
    s.textContent = '(function(){' + compiled + '})();';
    document.head.appendChild(s);
  }).catch(function () {
    var fb = document.createElement('script'); fb.type = 'text/babel'; fb.src = 'tracker-app.js';
    document.head.appendChild(fb);
  });
})();
</script>
