<!-- UX-12 Phase 7 PR #13: redirect to /home when no project is active.
     Direct URLs and PWA shortcuts continue to work when a project IS active.
     If a ?id=<projectId> URL param is present (added by home/stash Track
     buttons as a belt-and-suspenders fallback), write it as the active
     pointer before the redirect check so stale-pointer races are healed. -->
<script>
(function(){
  try {
    var qs = location.search || '';
    // If ?id=<projectId> is in the URL, write it as the active pointer now
    // (synchronously, before any IDB reads) so the tracker always has the
    // right project ID even if the localStorage pointer was cleared by a
    // race during navigation.
    var idMatch = qs.match(/(?:\?|&)id=([^&]+)/);
    if (idMatch) {
      var urlId = decodeURIComponent(idMatch[1]);
      if (urlId && /^proj_/.test(urlId)) {
        try { localStorage.setItem('crossstitch_active_project', urlId); } catch (_) {}
      }
    }
    var active = localStorage.getItem('crossstitch_active_project');
    if (!active) {
      var skip = /(\?|&)(from=home|action=)/.test(qs);
      if (!skip) { location.replace('home.html'); return; }
    }
  } catch (_) { /* localStorage blocked â†’ load tool normally */ }
})();
</script>

<!-- pdf.js + pdf-importer are lazy-loaded on first PDF import -->
<script>
window.loadScript = function(src, opts) {
  if (document.querySelector('script[src="' + src + '"]')) return Promise.resolve();
  opts = opts || {};
  return new Promise(function(res, rej) {
    var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej;
    if (opts.integrity) { s.integrity = opts.integrity; s.crossOrigin = opts.crossOrigin || 'anonymous'; s.referrerPolicy = 'no-referrer'; }
    document.head.appendChild(s);
  });
};
window.loadPdfStack = function() {

    .then(function() { if (typeof pdfjsLib !== 'undefined') pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js'; return window.loadScript('pdf-importer.js'); });
};
</script>

<!-- Cat C perf split: conditionally preload the ImportWizard bundle only
     when the experimental flag is on. Default users never fetch the 30 KB.
     The wizard branch in tracker-app.js already falls back to the legacy
     modal if window.ImportWizard isn't present. -->
<script>
(function maybePreloadImportWizard() {
  try {
    var on = window.UserPrefs && window.UserPrefs.get && window.UserPrefs.get('experimental.importWizard');
    if (!on) return;
    var go = function () {
      if (document.querySelector('script[src="creator/import-wizard-bundle.js"]')) return;
      var s = document.createElement('script');
      s.src = 'creator/import-wizard-bundle.js';
      document.head.appendChild(s);
    };
    if (typeof requestIdleCallback === 'function') requestIdleCallback(go, { timeout: 2000 });
    else setTimeout(go, 0);
  } catch (_) {}
})();
</script>
<script>
/* PERF (action plan Â§2A.5): cache the in-browser Babel compile of
   tracker-app.js in localStorage. Without this, every page load
   re-runs Babel on the ~6 KLOC source (~80â€“150 ms TBT). The cache
   key is shared with index.html so visitors who land on either entry
   benefit from a single compile. The hash suffix is auto-bumped by
   build-creator-bundle.js when tracker-app.js content changes. */
(function () {
  if (typeof window === 'undefined') return;
  var TRACKER_CACHE_KEY = 'babel_tracker_ed6bfb38bb';
  var cached = null;
  try { cached = localStorage.getItem(TRACKER_CACHE_KEY); } catch (e) {}
  if (cached) {
    /* Wrap in IIFE so const/let don't collide with the surrounding script. */
    var s = document.createElement('script');
    s.textContent = '(function(){' + cached + '})();';
    document.head.appendChild(s);
    return;
  }
  /* No cache yet: fetch + compile. On fetch failure (file://, offline)
     fall back to a text/babel tag so Babel-standalone compiles inline. */
  if (typeof Babel === 'undefined') {
    var fb0 = document.createElement('script'); fb0.type = 'text/babel'; fb0.src = 'tracker-app.js';
    document.head.appendChild(fb0);
    return;
  }
  fetch('tracker-app.js').then(function (r) {
    return r.ok ? r.text() : Promise.reject('fetch failed');
  }).then(function (src) {
    var compiled = Babel.transform(src, { presets: ['react'], filename: 'tracker-app.js' }).code;
    try { localStorage.setItem(TRACKER_CACHE_KEY, compiled); } catch (e) {}
    var s = document.createElement('script');
    s.textContent = '(function(){' + compiled + '})();';
    document.head.appendChild(s);
  }).catch(function () {
    var fb = document.createElement('script'); fb.type = 'text/babel'; fb.src = 'tracker-app.js';
    document.head.appendChild(fb);
  });
})();
</script>
