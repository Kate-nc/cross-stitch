<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept 4: Metro Bento</title>
    <style>
        :root {
            --bg: #111827; /* Dark background to make colors pop */
            --text-light: #ffffff;
            /* Metro colors */
            --c1: #B85C38; /* App Accent */
            --c2: #059669;
            --c3: #2563eb;
            --c4: #7c3aed;
            --c5: #db2777;
            --c6: #d97706;
            --c7: #475569;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 2vw;
            color: var(--text-light);
        }

        .metro-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            grid-auto-rows: 180px;
            gap: 8px; /* Very tight spacing */
            max-width: 1200px;
            margin: 0 auto;
        }

        .tile {
            position: relative;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            overflow: hidden;
            transition: transform 0.1s;
            cursor: pointer;
        }
        .tile:hover {
            transform: scale(0.98);
        }
        .tile:active {
            transform: scale(0.95);
        }

        /* Tile sizes */
        .large { grid-column: span 2; grid-row: span 2; }
        .wide { grid-column: span 2; grid-row: span 1; }
        .tall { grid-column: span 1; grid-row: span 2; }
        .standard { grid-column: span 1; grid-row: span 1; }

        /* Data layout inside tiles */
        .tile-title {
            position: absolute;
            bottom: 16px;
            left: 16px;
            font-size: 14px;
            font-weight: 600;
        }

        .tile-value {
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 42px;
            font-weight: 300;
            line-height: 1;
        }
        .large .tile-value {
            top: 24px;
            left: 24px;
            font-size: 72px;
            right: auto;
        }
        .large .tile-sub {
            position: absolute;
            top: 100px;
            left: 24px;
            font-size: 18px;
            opacity: 0.8;
        }

        .tile-viz {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.2;
            font-size: 100px;
            pointer-events: none;
        }
        .large .tile-viz { opacity: 1; inset: auto 20px 50px 20px; height: 100px; background: rgba(0,0,0,0.2); border-radius: 4px; display: flex; align-items:center; justify-content:center; font-size:16px;}

        @media (max-width: 800px) {
            .metro-grid { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 150px; }
            .large, .wide { grid-column: span 2; }
            .tall { grid-row: span 1; }
        }
    </style>
</head>
<body>

    <div class="metro-grid">

        <div class="tile large" style="background: var(--c1);">
            <div class="tile-value">124,592</div>
            <div class="tile-sub">Lifetime Stitches</div>
            <div class="tile-viz">[ Activity Graph ]</div>
            <div class="tile-title">Overview</div>
        </div>

        <div class="tile standard" style="background: var(--c2);">
            <div class="tile-viz">✓</div>
            <div class="tile-value">4</div>
            <div class="tile-title">Active Projects</div>
        </div>

        <div class="tile standard" style="background: var(--c3);">
            <div class="tile-viz">🔥</div>
            <div class="tile-value">12</div>
            <div class="tile-title">Week Streak</div>
        </div>

        <div class="tile wide" style="background: var(--c4);">
            <div class="tile-viz" style="font-size: 60px; right: 20px; left: auto; opacity: 0.3;">⚖️</div>
            <div class="tile-value" style="font-size: 28px; top:auto; bottom:40px; left:16px;">Balanced</div>
            <div class="tile-title">SABLE Index</div>
        </div>

        <div class="tile tall" style="background: var(--c5);">
            <div class="tile-viz" style="font-size: 80px;">🎨</div>
            <div class="tile-value" style="top:auto; bottom: 40px; left: 16px;">84%</div>
            <div class="tile-title">DMC Coverage</div>
        </div>

        <div class="tile wide" style="background: var(--c6);">
            <div class="tile-value" style="font-size: 32px; right:auto; left: 16px; top: 16px;">3 Patterns Ready</div>
            <div class="tile-title">Start Next</div>
        </div>

        <div class="tile standard" style="background: var(--c7);">
            <div class="tile-value" style="font-size: 24px;">340 / d</div>
            <div class="tile-title">Recent Pace</div>
        </div>

        <div class="tile standard" style="background: var(--c7);">
            <div class="tile-value">3</div>
            <div class="tile-title">Finished YTD</div>
        </div>

    </div>
</body>
</html>
