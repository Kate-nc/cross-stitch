<!-- Dedicated Creator entry-point. Unlike index.html (which redirects to
     /home when no project is active), create.html is reached only via
     deliberate navigation from /home or via the Header "Create" link, so
     no redirect logic runs here. This separation was introduced after the
     /home -> index.html?action=home-image-pending hand-off was repeatedly
     mis-diagnosed because index.html had two responsibilities (redirect
     gateway AND Creator host). create.html does exactly one thing. -->

<!-- Defensive redirect: create.html is normally reached via a deliberate
     action= deep link (home-image-pending, new-blank, open) OR with an
     active project already set. If neither is true the user has typed the
     URL or back-navigated to a stale state â€” send them to /home Create
     tab where they can pick the canonical entry point, instead of showing
     the bare welcome card. The check intentionally allows action= and
     from=home through unconditionally so live handoffs always proceed. -->
<script>
(function(){
  try {
    var qs = location.search || '';
    var idMatch = qs.match(/(?:\?|&)id=([^&]+)/);
    if (idMatch) {
      var urlId = decodeURIComponent(idMatch[1]);
      if (urlId && /^proj_/.test(urlId)) {
        try { localStorage.setItem('crossstitch_active_project', urlId); } catch (_) {}
      }
    }
    var hasAction = /(\?|&)(from=home|action=)/.test(qs);
    if (hasAction) return;    // Safety net: a SW-triggered reload may have stripped the action= param
    // from the URL (via history.replaceState in processPendingAction) while a
    // home-image-pending handoff was still in progress. If sessionStorage still
    // holds the pending data URL, let create.html load so it can reconstruct
    // the file — processPendingAction's recovery path handles it from there.
    try { if (sessionStorage.getItem('cs_pending_image_dataurl')) return; } catch (_) {}    var active = localStorage.getItem('crossstitch_active_project');
    if (!active) { location.replace('home.html?tab=create'); return; }
  } catch (_) { /* localStorage blocked â†’ load tool normally */ }
})();
</script>

/* Cat C perf split: ImportWizard + useImportWizard (~30 KB) live in their
   own bundle. Default users (experimental.importWizard flag off) never load
   it. Wizard users get it preloaded on idle so it's ready when they open
   the import dialog. The wizard branch in tracker-app.js already gracefully
   falls back to the legacy single-step modal if window.ImportWizard isn't
   present, so a slow network won't break the import flow. */
(function maybePreloadImportWizard() {
  try {
    var on = window.UserPrefs && window.UserPrefs.get && window.UserPrefs.get('experimental.importWizard');
    if (!on) return;
    var go = function () { try { window.loadScript('creator/import-wizard-bundle.js').catch(function () {}); } catch (_) {} };
    if (typeof requestIdleCallback === 'function') requestIdleCallback(go, { timeout: 2000 });
    else setTimeout(go, 0);
  } catch (_) {}
})();
window.loadTrackerApp = function() {
  if (window.__trackerLoading || typeof window.TrackerApp !== 'undefined') return window.__trackerLoadPromise || Promise.resolve();
  window.__trackerLoading = true;
  window.__trackerLoadPromise = window.loadScript('compiled/tracker-app.compiled.js', {
    test: function () { return typeof window.TrackerApp !== 'undefined'; },
    failMessage: 'This page could not load (the tracker bundle is missing or failed to download). Please rebuild the app and reload.'
  }).then(function () {

};
