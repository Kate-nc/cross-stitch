name: CI

# Action plan §2D.3. Runs the Jest test suite on every push and PR so
# regressions are caught before merge. The suite is fast (~3–5 s) and
# pure-Node (no browser binaries needed).

on:
  push:
    branches:
      - main
      - 'performance-upgrades-*'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Jest (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Match the engines pin in package.json (Node 22).
        node: ['22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify generated bundles are up to date
        # Compare all Creator and import outputs without writing into the checkout.
        run: node scripts/check-generated-bundles.js

      - name: Check service-worker build fingerprints
        run: node build-sw.js --check

      - name: Run Jest
        run: npm test -- --ci --reporters=default
